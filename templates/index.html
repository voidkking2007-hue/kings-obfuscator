<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING's Obfuscator</title>
    <style>
        :root {
            --bg-color: #07060a;
            --card-bg: #100e17;
            --purple-neon: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.3);
            --text-white: #ffffff;
            --text-gray: #9ca3af;
            --border-color: rgba(168, 85, 247, 0.25);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-white);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            box-sizing: border-box;
            background-color: rgba(7, 6, 10, 0.8);
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        .logo span {
            color: var(--purple-neon);
            text-shadow: 0 0 12px var(--purple-glow);
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--purple-neon);
            text-transform: uppercase;
        }
        .main-container {
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.1;
        }
        h1 span {
            color: var(--purple-neon);
            text-shadow: 0 0 20px var(--purple-glow);
        }
        .subtitle {
            color: var(--text-gray);
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 180px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            color: var(--text-white);
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: var(--purple-neon);
            box-shadow: 0 0 10px var(--purple-glow);
        }
        .vip-input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-white);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .vip-input:focus {
            border-color: var(--purple-neon);
            box-shadow: 0 0 10px var(--purple-glow);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--purple-glow);
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .result-section {
            width: 100%;
            margin-top: 30px;
        }
        .result-section h3 {
            font-size: 16px;
            color: var(--purple-neon);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">KING'S <span>OBFUSCATOR</span></div>
        <div class="badge">Elite Security</div>
    </header>

    <div class="main-container">
        <h1>Secure. Protect. <span>Dominate.</span></h1>
        <p class="subtitle">The ultimate obfuscation and protection system for your Roblox scripts.</p>

        <form method="POST">
            <textarea name="lua_code" placeholder="Paste your Lua script here..."></textarea>
            <input type="text" name="vip_key" class="vip-input" placeholder="Introdu Cheie VIP (opțional)...">
            <button type="submit" class="btn">OBFUSCATE SCRIPT</button>
        </form>

        {% if obfuscated %}
        <div class="result-section">
            <h3>Obfuscated Result:</h3>
            <textarea readonly>{{ obfuscated }}</textarea>
        </div>
        {% endif %}
    </div>
</body>
</html>
